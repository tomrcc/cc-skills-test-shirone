timezone: Asia/Shanghai

paths:
  static: public
  uploads: public/images

markdown:
  engine: commonmark
  options:
    gfm: true
    html: true
    table: true
    strikethrough: true
    code_block_fences: "```"
    escape_snippets_in_code_blocks: true

_editables:
  content:
    format: p h2 h3 h4 h5
    bold: true
    italic: true
    strike: true
    underline: true
    link: true
    code_inline: true
    code_block: true
    blockquote: true
    bulletedlist: true
    numberedlist: true
    horizontalrule: true
    image: true
    table: true
    snippet: true
    removeformat: true
    undo: true
    redo: true

collection_groups:
  - heading: Writing
    collections:
      - posts
      - series
      - moments
      - albums
  - heading: Pages
    collections:
      - spec
      - home
      - feature_pages
      - snippets
  - heading: Site
    collections:
      - settings
      - data

data_config:
  icons:
    path: src/data/icons.json
  tags:
    path: src/data/tags.json
  categories:
    path: src/data/categories.json
  projects:
    path: src/data/projects.json
  skills:
    path: src/data/skills.json
  timeline:
    path: src/data/timeline.json
  devices:
    path: src/data/devices.json
  games:
    path: src/data/games.json
  friends:
    path: src/data/friends.json
  compass:
    path: src/data/compass.json
  anime:
    path: src/data/anime.json
  music:
    path: src/data/music.json
  site_settings:
