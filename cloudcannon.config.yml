_inputs:
  _schema:
    hidden: true
  icon:
    type: select
    label: Icon
    comment: Pick an icon, or type a name from Material Symbols, Simple Icons or Font Awesome 7 on [Iconify](https://icon-sets.iconify.design/), such as material-symbols:home-rounded.
    options:
      allow_create: true
      allow_empty: true
      empty_type: string
      value_key: id
      preview:
        text:
          - key: name
      values: data.icons

collections_config:
  posts:
    path: src/content/posts
    name: Posts
    singular_name: Post
    icon: post_add
    url: "/posts/[full_slug]/"
    glob:
      - "**/*.md"
      - "**/*.mdx"
    create:
      path: "[relative_base_path]/{title|slugify|lowercase}.[ext]"
    disable_add_folder: true
    _enabled_editors:
      - visual
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/post.md
        name: Post
        remove_extra_inputs: false
    add_options:
      - name: Post
        schema: default
        icon: post_add
        editor: content
    _inputs:
      title:
        type: text
        label: Title
        options:
          required: true
      published:
        type: date
        label: Published
        comment: The date shown on the post and used to sort it.
        instance_value: NOW
        options:
          required: true
      updated:
        type: date
        label: Last updated
        comment: Shows a "last updated" note on older posts.
      description:
        type: textarea
        label: Description
        comment: Shown in post lists, search results and link previews.
        options:
          empty_type: string
      image:
        type: image
        label: Cover image
        options:
          empty_type: string
          paths:
            uploads: public/images/posts
      tags:
        type: multiselect
        label: Tags
        options:
          allow_create: true
          empty_type: array
          values: data.tags
      category:
        type: select
        label: Category
        options:
          allow_create: true
          allow_empty: true
          empty_type: string
          values: data.categories
      series:
        type: select
        label: Series
        comment: Leave empty for a post that isn't part of a series.
        options:
          allow_empty: true
          empty_type: string
          value_key: filename_without_ext
          preview:
            text:
              - key: title
          values: collections.series
      seriesOrder:
        type: number
        label: Order in series
        comment: Leave empty to order by published date.
        options:
          min: 1
          step: 1
      lang:
        type: select
        label: Language
        comment: The language the post is written in. Site default uses the site language.
        options:
          allow_empty: true
          empty_type: string
          value_key: id
          preview:
            text:
              - key: name
          values: _select_data.locales
      pinned:
        type: switch
        label: Pin to the top of the home page
      draft:
        type: switch
        label: Draft
        comment: Drafts are left out of the published site.
      comment:
        type: switch
        label: Allow comments
      encrypted:
        type: switch
        label: Password protected
        comment: Readers need the password to see the post body.
      password:
        type: text
        label: Password
        hidden: "!encrypted"
        options:
          empty_type: string
      passwordHint:
        type: text
        label: Password hint
        hidden: "!encrypted"
        options:
          empty_type: string
      hideHomeContent:
        type: switch
        label: Hide excerpt on the home page
        hidden: "!encrypted"
      publishedAt:
        type: datetime
        label: Exact publish time
        comment: Optional. A precise time for the post, used where the date alone isn't enough.
      updatedAt:
        type: datetime
        label: Exact update time
        comment: Optional. A precise time for the last update.
      license:
        type: object
        label: Licence
        comment: Optional. Overrides the site-wide licence for this post. Leave out any part to use the site default.
        options:
          preview:
            icon: copyright
      license.enable:
        type: switch
        label: Show the licence
      license.name:
        type: text
        label: Licence name
      license.url:
        type: url
        label: Licence address
      license.author:
        type: object
        label: Author
        options:
          preview:
            icon: person
      license.author.name:
        type: text
        label: Author name
      license.author.url:
        type: url
        label: Author address
      license.source:
        type: url
        label: Original source
        comment: Leave empty for original work.
      alias:
        type: text
        label: Alias
        comment: Optional. An extra address that points to this post.
      permalink:
        type: text
        label: Custom address
        comment: Optional. Used only when custom permalinks are turned on for the site.
      prevUrl:
        hidden: true
      nextUrl:
        hidden: true
      prevTitle:
        hidden: true
      prevSlug:
        hidden: true
      nextTitle:
        hidden: true
      nextSlug:
        hidden: true

  series:
    path: src/content/series
    name: Series
    singular_name: Series
    icon: collections_bookmark
    url: "/series/[slug]/"
    glob:
      - "*.md"
    create:
      path: "[relative_base_path]/{title|slugify|lowercase}.[ext]"
    disable_add_folder: true
    new_preview_url: /series/markdown-syntax-guide/
    _enabled_editors:
      - visual
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/series.md
        name: Series
    _inputs:
      title:
        type: text
        label: Title
        options:
          required: true
      status:
        type: select
        label: Status
        options:
          value_key: id
          preview:
            text:
              - key: name
          values:
            - name: Ongoing
              id: ongoing
            - name: Completed
              id: completed
      defaultCategory:
        type: select
        label: Default category
        comment: Used for posts in this series that don't set their own category.
        options:
          allow_create: true
          allow_empty: true
          empty_type: string
          values: data.categories

  moments:
    path: src/content/moments
    name: Moments
    singular_name: Moment
    icon: chat_bubble
    disable_url: true
    glob:
      - "*.md"
    create:
      path: "[relative_base_path]/{published|year}-{published|month}-{published|day}-{location|slugify|lowercase|default=moment}.[ext]"
    disable_add_folder: true
    _enabled_editors:
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/moment.md
        name: Moment
    add_options:
      - name: Moment
        schema: default
        icon: chat_bubble
        editor: content
    _inputs:
      published:
        type: datetime
        label: Posted
        instance_value: NOW
        options:
          required: true
      pinned:
        type: switch
        label: Pin to the top
      location:
        type: text
        label: Location
        options:
          empty_type: string
      mood:
        type: select
        label: Mood icon
        comment: Pick an icon, or type a name from Material Symbols on [Iconify](https://icon-sets.iconify.design/material-symbols/).
        options:
          allow_create: true
          allow_empty: true
          empty_type: string
          value_key: id
          preview:
            text:
              - key: name
          values: data.icons
      tags:
        type: multiselect
        label: Tags
        options:
          allow_create: true
          empty_type: array
          values: data.tags
      images:
        type: array
        label: Images
        options:
          empty_type: array
          structures: _structures.moment_images
      encrypted:
        type: switch
        label: Password protected
      password:
        type: text
        label: Password
        hidden: "!encrypted"
        options:
          empty_type: string
      passwordHint:
        type: text
        label: Password hint
        hidden: "!encrypted"
        options:
          empty_type: string
      draft:
        type: switch
        label: Draft
        comment: Drafts are left out of the published site.

  albums:
    path: public/images/albums
    name: Albums
    singular_name: Album
    icon: photo_library
    url: "/albums/[relative_base_path]/"
    glob:
      - "**/*.json"
    create:
      path: "[relative_base_path]/{title|slugify|lowercase}/info.json"
    disable_add_folder: true
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/album.json
        name: Album of images in its folder
      external:
        path: .cloudcannon/schemas/album-external.json
        name: Album with a photo list
    add_options:
      - name: Album
        schema: external
        icon: photo_library
        editor: data
    _inputs:
      title:
        type: text
        label: Title
        options:
          required: true
      description:
        type: textarea
        label: Description
        options:
          empty_type: string
      date:
        type: date
        label: Date
        options:
          empty_type: string
      location:
        type: text
        label: Location
        options:
          empty_type: string
      tags:
        type: array
        label: Tags
        options:
          empty_type: array
      tags[*]:
        type: text
        label: Tag
      layout:
        type: select
        label: Layout
        options:
          value_key: id
          preview:
            text:
              - key: name
          values:
            - name: Masonry
              id: masonry
            - name: Grid
              id: grid
      columns:
        type: select
        label: Columns
        options:
          value_key: id
          preview:
            text:
              - key: name
          values:
            - name: Two columns
              id: 2
            - name: Three columns
              id: 3
            - name: Four columns
              id: 4
      hidden:
        type: switch
        label: Hide from the albums page
        comment: The album stays reachable at its own address.
      password:
        type: text
        label: Password
        comment: Leave empty for a public album.
        options:
          empty_type: string
      passwordHint:
        type: text
        label: Password hint
        options:
          empty_type: string
      mode:
        type: text
        hidden: true
      cover:
        type: image
        label: Cover image
        options:
          required: true
          paths:
            uploads: public/images/albums
      photos:
        type: array
        label: Photos
        options:
          empty_type: array
          structures: _structures.album_photos

  spec:
    path: src/content/spec
    name: About page
    singular_name: Page
    icon: info
    url: "/[slug]/"
    glob:
      - "*.md"
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - content
      - data

  snippets:
    path: src/content/snippets
    name: Shared text
    singular_name: Shared text
    icon: content_paste
    disable_url: true
    glob:
      - "*.md"
    create:
      path: "[relative_base_path]/{title|slugify|lowercase|default=shared-text}.[ext]"
    disable_add_folder: true
    _enabled_editors:
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/snippet.md
        name: Shared text
    add_options:
      - name: Shared text
        schema: default
        icon: content_paste
        editor: content

  settings:
    path: site-settings/config
    name: Site settings
    singular_name: Settings file
    icon: settings
    disable_url: true
    glob:
      - "*.yaml"
      - "!projects.yaml"
      - "!skills.yaml"
      - "!timeline.yaml"
      - "!devices.yaml"
      - "!games.yaml"
      - "!friends.yaml"
      - "!compass.yaml"
      - "!anime.yaml"
      - "!moments.yaml"
      - "!albums.yaml"
      - "!post-list.yaml"
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - data

  home:
    path: site-settings/config
    name: Home page
    singular_name: Home page
    icon: home
    url: /
    glob:
      - post-list.yaml
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - data

  feature_pages:
    path: site-settings/config
    name: Feature pages
    singular_name: Feature page
    icon: web
    url: "/[slug]/"
    glob:
      - projects.yaml
      - skills.yaml
      - timeline.yaml
      - devices.yaml
      - games.yaml
      - friends.yaml
      - compass.yaml
      - anime.yaml
      - moments.yaml
      - albums.yaml
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - data

  data:
    path: src/data
    name: Page data
    singular_name: Data file
    icon: database
    disable_url: true
    glob:
      - projects.json
      - skills.json
      - timeline.json
      - devices.json
      - games.json
      - friends.json
      - compass.json
      - anime.json
      - music.json
      - tags.json
      - categories.json
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - data

file_config:
  - glob:
      - src/content/posts/mdx-showcase.mdx
      - src/content/posts/markdown-fields.md
      - src/content/posts/option-groups.md
      - src/content/posts/content-annotations.md
    _enabled_editors:
      - data

  - glob: site-settings/config/site.yaml
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: web
      title:
        type: text
        label: Site title
        options:
          required: true
          empty_type: string
      subtitle:
        type: text
        label: Subtitle
        options:
          empty_type: string
      lang:
        type: select
        label: Site language
        comment: The language of the site's built-in text, such as menus and buttons.
        options:
          value_key: id
          preview:
            text:
              - key: name
          values:
            - name: English
              id: en
            - name: Simplified Chinese
              id: zh_CN
            - name: Traditional Chinese
              id: zh_TW
            - name: Japanese
              id: ja
            - name: Korean
              id: ko
            - name: Spanish
              id: es
            - name: Thai
              id: th
            - name: Vietnamese
              id: vi
            - name: Turkish
              id: tr
            - name: Indonesian
              id: id
      themeColor:
        type: object
        label: Theme colour
        options:
          preview:
            icon: palette
      themeColor.hue:
        type: range
        label: Hue
        comment: The starting point for the site's colour palette, from 0 to 360.
        options:
          min: 0
          max: 360
          step: 1
      banner:
        type: object
        label: Banner
        options:
          preview:
            icon: panorama
      banner.src:
        type: object
        label: Banner images
        options:
          preview:
            icon: image
      banner.src.desktop:
        type: array
        label: Wide screens
        comment: More than one image turns on the slideshow.
        options:
          empty_type: array
      banner.src.desktop[*]:
        type: image
        label: Image
        options:
          paths:
            uploads: src/assets/images/banner/desktop
            static: ""
      banner.src.mobile:
        type: array
        label: Phones
        options:
          empty_type: array
      banner.src.mobile[*]:
        type: image
        label: Image
        options:
          paths:
            uploads: src/assets/images/banner/mobile
            static: ""
      banner.position:
        type: select
        label: Image focus
        options:
          value_key: id
          preview:
            text:
              - key: name
          values:
            - name: Top
              id: top
            - name: Centre
              id: center
            - name: Bottom
              id: bottom
      banner.dim:
        type: object
        label: Darken the image
        options:
          preview:
            icon: contrast
      banner.dim.enable:
        type: switch
        label: Darken the banner image
      banner.dim.opacity:
        type: range
        label: Amount
        options:
          min: 0
          max: 1
          step: 0.01
      banner.homeText:
        type: object
        label: Home page text
        options:
          preview:
            icon: title
      banner.homeText.enable:
        type: switch
        label: Show text on the home banner
      banner.homeText.title:
        type: text
        label: Title
        options:
          empty_type: string
      banner.homeText.subtitle:
        type: array
        label: Subtitles
        comment: Shown one after another when typing is on.
        options:
          empty_type: array
      banner.homeText.subtitle[*]:
        type: text
        label: Subtitle
      banner.homeText.typewriter:
        type: object
        label: Typing effect
        options:
          preview:
            icon: keyboard
      banner.homeText.typewriter.enable:
        type: switch
        label: Type the subtitles out
      banner.carousel:
        type: object
        label: Slideshow
        options:
          preview:
            icon: slideshow
      banner.carousel.enable:
        type: switch
        label: Play the slideshow
      banner.carousel.interval:
        type: number
        label: Time per image (milliseconds)
        options:
          min: 1000
          step: 500
      banner.carousel.animation:
        type: select
        label: Camera movement
        options:
          value_key: id
          preview:
            text:
              - key: name
          values:
            - name: Ken Burns
              id: ken-burns
            - name: Zoom in
              id: zoom-in
            - name: Zoom out
              id: zoom-out
            - name: Pan left
              id: pan-left
            - name: Pan right
              id: pan-right
            - name: None
              id: none
      banner.waves:
        type: object
        label: Waves
        options:
          preview:
            icon: waves
      banner.waves.enable:
        type: switch
        label: Show waves along the bottom of the banner

  - glob: site-settings/config/profile.yaml
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: account_circle
      avatar:
        type: image
        label: Avatar
        options:
          empty_type: string
          paths:
            uploads: src/assets/images
            static: ""
      name:
        type: text
        label: Name
        options:
          required: true
          empty_type: string
      bio:
        type: textarea
        label: Bio
        options:
          empty_type: string
      links:
        type: array
        label: Social links
        options:
          empty_type: array
          structures: _structures.profile_links

  - glob: site-settings/config/announcement.yaml
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: campaign
      title:
        type: text
        label: Title
        comment: Leave empty to use the built-in "Announcement" heading.
        options:
          empty_type: string
      content:
        type: textarea
        label: Announcement
        comment: Leave empty to hide the announcement.
        options:
          empty_type: string
      closable:
        type: switch
        label: Readers can close it
      link:
        type: object
        label: Link
        options:
          preview:
