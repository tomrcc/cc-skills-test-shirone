  sidebar_settings:
    path: site-settings/config/sidebar.yaml
  post_list_settings:
    path: site-settings/config/post-list.yaml
  article_settings:
    path: site-settings/config/article.yaml
  license_settings:
    path: site-settings/config/license.yaml
  series_settings:
    path: site-settings/config/series.yaml
